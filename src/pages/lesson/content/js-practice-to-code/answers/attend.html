<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>출석 인원</title>
</head>
<body>
  <h2>실제 출석 인원</h2>
  <p>QR 스캔 기록 : A01, B02, A01, C03, B02</p>

  <button onclick="countAttend()">인원 세기</button>
  <div id="result"></div>

  <script>
    function countAttend() {
      // 1. 스캔 기록을 준비한다
      const scans = ['A01', 'B02', 'A01', 'C03', 'B02'];

      // 2. 이미 본 학번을 담을 빈 목록을 만든다
      let seen = [];

      // 3. 스캔을 하나씩 보면서, 본 목록에 없는 학번이면 본 목록에 넣는다
      for (let i = 0; i < scans.length; i++) {
        if (seen.indexOf(scans[i]) == -1) {
          seen.push(scans[i]);
        }
      }

      // 4. 본 목록의 길이가 출석 인원이다
      document.getElementById('result').innerHTML = '출석 ' + seen.length + '명';
    }
  </script>
</body>
</html>
