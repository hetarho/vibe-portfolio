<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>분식집 합계</title>
</head>
<body>
  <h2>분식집 주문</h2>

  <label><input type="checkbox" name="menu" value="4000"> 떡볶이 4,000원</label><br>
  <label><input type="checkbox" name="menu" value="3500"> 김밥 3,500원</label><br>
  <label><input type="checkbox" name="menu" value="5000"> 라면 5,000원</label><br>
  <label><input type="checkbox" name="menu" value="2500"> 튀김 2,500원</label><br>
  <button onclick="total()">합계 보기</button>
  <div id="result"></div>

  <script>
    function total() {
      // 1. 메뉴 칸을 전부 모은다
      const menus = document.getElementsByName('menu');

      // 2. 합계 그릇을 0원으로 시작한다
      let sum = 0;

      // 3. 하나씩 보면서 체크된 메뉴면 가격을 숫자로 바꿔 더한다
      for (let i = 0; i < menus.length; i++) {
        if (menus[i].checked) {
          sum += Number(menus[i].value);
        }
      }

      // 4. 합계를 보여준다
      document.getElementById('result').innerHTML = '합계 ' + sum + '원';
    }
  </script>
</body>
</html>
