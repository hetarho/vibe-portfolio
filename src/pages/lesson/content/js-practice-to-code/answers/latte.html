<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>라떼 최대 잔 수</title>
</head>
<body>
  <h2>라떼는 몇 잔까지</h2>
  <p>라떼 한 잔에는 우유 1개와 샷 2개가 필요합니다.</p>

  우유 : <input type="number" id="milk">
  샷 : <input type="number" id="shot">
  <button onclick="maxCups()">계산</button>
  <div id="result"></div>

  <script>
    function maxCups() {
      // 1. 우유 개수와 샷 개수를 숫자로 가져온다
      const milk = Number(document.getElementById('milk').value);
      const shot = Number(document.getElementById('shot').value);

      // 2. 우유로 만들 수 있는 잔 수를 구한다 (가진 개수 ÷ 한 잔에 드는 개수의 몫)
      const byMilk = Math.floor(milk / 1);

      // 3. 샷으로 만들 수 있는 잔 수를 구한다
      const byShot = Math.floor(shot / 2);

      // 4. 둘 다 있어야 하므로 두 수 중 작은 값이 최대 잔 수다
      const cups = Math.min(byMilk, byShot);

      // 5. 결과를 보여준다
      document.getElementById('result').innerHTML = '최대 ' + cups + '잔';
    }
  </script>
</body>
</html>
