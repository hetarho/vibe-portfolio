<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>05 · 로그인</title>
</head>
<body>
  <!--
    [문제]
    「로그인」 버튼을 누르면 아래 순서로 확인합니다.
    1) 아이디가 비어 있으면 "아이디를 입력해주세요" 알림창을 띄우고 아이디 칸에 커서를 둡니다
    2) 비밀번호가 비어 있으면 "비밀번호를 입력해주세요" 알림창을 띄우고 비밀번호 칸에 커서를 둡니다
    3) 아이디가 admin이고 비밀번호가 1234이면 아래 네모에 초록 글자로 "admin님, 환영합니다"를 보여줍니다
    4) 그 밖에는 "아이디 또는 비밀번호가 틀렸습니다" 알림창을 띄우고,
       비밀번호 칸을 비운 뒤 비밀번호 칸에 커서를 둡니다

    쓰는 카드 : 3 이벤트에 함수 걸기 · 1 값 가져오기 · 8 걸리면 알리고 멈추기 · 4 스타일 바꾸기
    이번에는 화면만 있습니다. 버튼에 함수를 거는 것부터 직접 합니다.

    [작은 경우로 확인]
    - 아무것도 안 쓰고 누름          → 아이디부터 알린다
    - 아이디만 쓰고 누름             → 비밀번호를 알린다
    - admin / 1111                   → 틀렸다고 알리고 비밀번호 칸만 빈다
    - admin / 1234                   → 초록 글자로 환영
  -->
  <h2>05 · 로그인</h2>

  아이디 : <input type="text" id="userId"><br><br>
  비밀번호 : <input type="password" id="pwd"><br><br>
  <button>로그인</button>
  <div id="result"></div>

  <script>
    // 함수 이름부터 정하고, 한글 절차를 주석으로 먼저 씁니다

  </script>
</body>
</html>
