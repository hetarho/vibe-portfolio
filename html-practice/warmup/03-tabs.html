<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>03 · 탭 메뉴</title>
  <style>
    .panel { display: none; width: 360px; margin-top: 8px; padding: 12px; background: lightgray; }
  </style>
</head>
<body>
  <!--
    [문제]
    분식집 소개 화면입니다. 탭 버튼 세 개 중 하나를 누르면
    그 탭의 내용만 보이고 나머지 둘은 숨겨지게 하세요.
    처음 열었을 때는 「메뉴」 내용이 보입니다.

    쓰는 카드 : 4 스타일 바꾸기 · 매개변수
    화면과 함수 이름은 만들어 두었습니다.
    이번에는 한글 절차도 직접 씁니다. 함수 안에 주석으로 먼저 쓰고, 그 아래를 채웁니다.

    [작은 경우로 확인]
    - 메뉴 → 위치 → 영업시간 순서로 누르면 내용이 하나씩만 보인다
    - 같은 탭을 두 번 눌러도 그대로다
    - 도전 : 지금 보고 있는 탭 버튼의 글자만 빨갛게 바꿔 봅니다
             (버튼 id는 tab-menu, tab-place, tab-hours)
  -->
  <h2>03 · 탭 메뉴</h2>

  <button id="tab-menu" onclick="showTab('menu')">메뉴</button>
  <button id="tab-place" onclick="showTab('place')">위치</button>
  <button id="tab-hours" onclick="showTab('hours')">영업시간</button>

  <div id="menu" class="panel" style="display: block;">떡볶이 4,000원 · 김밥 3,500원 · 라면 5,000원</div>
  <div id="place" class="panel">KH정보교육원 1층 옆 골목</div>
  <div id="hours" class="panel">매일 11시 ~ 21시 · 월요일 휴무</div>

  <script>
    function showTab(kind) {
      // 한글 절차를 주석으로 먼저 씁니다

    }
  </script>
</body>
</html>
