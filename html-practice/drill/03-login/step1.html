<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 로그인 · Step 1</title>
  <link rel="stylesheet" href="../drill.css">
  <script src="../problems.js"></script>
  <script src="../drill.js" defer></script>
</head>
<body data-problem="login" data-step="1">
  <!--
    [2교시 · 03 로그인 · Step 1 보고 똑같이 치기]
    「로그인」을 누르면 위에서부터 차례로 확인해 결과 네모에 한 문장을 보여줍니다.
    아이디가 비었으면 "아이디를 입력해주세요", 비밀번호가 비었으면 "비밀번호를 입력해주세요"
    아이디가 admin이고 비밀번호가 1234이면 "admin님, 환영합니다"
    그 밖에는 "아이디 또는 비밀번호가 틀렸습니다"

    브라우저에서 이 파일을 열면 왼쪽 위에 정답, 그 아래에 빈 코드 칸이 있습니다.
    정답을 보고 코드 칸에 똑같이 칩니다. Ctrl+Enter로 실행 → 「채점하기」

    이 파일은 브라우저로 열어서 씁니다. 고칠 일이 있을 때만 VS Code로 엽니다.
    stage   : 오른쪽 「실행 화면」에 놓이는 HTML
    starter : 왼쪽 「내 코드」 칸에 처음 들어 있는 코드
  -->
  <template id="stage">
    아이디 : <input type="text" id="userId"><br><br>
    비밀번호 : <input type="password" id="pwd"><br><br>
    <button onclick="login()">로그인</button>
    <div id="result"></div>
  </template>

  <script type="text/plain" id="starter">

  </script>
</body>
</html>
