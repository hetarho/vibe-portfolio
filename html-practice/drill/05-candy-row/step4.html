<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 사탕 쏙쏙 · Step 4</title>
  <link rel="stylesheet" href="../drill.css">
  <script src="../problems.js"></script>
  <script src="../drill.js" defer></script>
</head>
<body data-problem="candyRow" data-step="4">
  <!--
    [3교시 · 05 사탕 쏙쏙 · Step 4 주석으로 뼈대 세우기]
    사탕 개수를 넣고 「사탕 놓기」를 누르면 그 개수만큼 사탕이 하나씩 쏙쏙 들어옵니다.
    사탕 하나는 '<li>사탕</li>' 한 줄입니다. 반복하면서 html 그릇에 붙인 다음 한 번에 넣습니다.
    1개보다 적으면 "1개 이상 넣어 주세요"를 보여줍니다.
    도전 : '<li>사탕</li>' 대신 '<li>' + i + '</li>'를 붙이면 숫자가 몇부터 나오나요?

    코드 칸에 한국어 주석만 들어 있습니다. 위에서부터 한 줄씩 치지 않습니다.
    껍데기부터 치고, 주석을 껍데기 안으로 옮긴 다음, 주석 아래를 채웁니다.

    이 파일은 브라우저로 열어서 씁니다. 고칠 일이 있을 때만 VS Code로 엽니다.
    stage   : 오른쪽 「실행 화면」에 놓이는 HTML
    starter : 왼쪽 「내 코드」 칸에 처음 들어 있는 코드
  -->
  <template id="stage">
    사탕 개수 : <input type="number" id="count">
    <button onclick="drop()">사탕 놓기</button>
    <ul id="result" class="pop candy"></ul>
  </template>

  <script type="text/plain" id="starter">
    // ★ 위에서부터 한 줄씩 치지 않습니다. 이 순서로 칩니다.
    //   ① function drop() { } 껍데기
    //   ② 그 안에 if () { } else { } 껍데기
    //   ③ else 안에 for (let i = 0; i < ; i++) { } 껍데기
    //   ④ 아래 한국어 주석을 껍데기 안 알맞은 자리로 옮기기
    //   ⑤ 주석 아래에 코드 채우기

    // 1. 사탕 개수를 숫자로 가져온다
    // 2. 1개보다 적으면 '1개 이상 넣어 주세요'를 보여준다
    // 3. 아니면 개수만큼 돌면서 html 그릇에 '<li>사탕</li>'를 붙이고
    // 4. 다 모은 html을 결과 목록에 넣는다
  </script>
</body>
</html>
