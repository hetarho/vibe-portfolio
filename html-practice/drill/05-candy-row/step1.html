<body data-problem="candyRow" data-step="1">
  <!--
    [3교시 · 05 사탕 쏙쏙 · Step 1 보고 똑같이 치기]
    사탕 개수를 넣고 「사탕 놓기」를 누르면 그 개수만큼 사탕이 하나씩 쏙쏙 들어옵니다.
    사탕 하나는 '<li>사탕</li>' 한 줄입니다. 반복하면서 html 그릇에 붙인 다음 한 번에 넣습니다.
    1개보다 적으면 "1개 이상 넣어 주세요"를 보여줍니다.
    도전 : '<li>사탕</li>' 대신 '<li>' + i + '</li>'를 붙이면 숫자가 몇부터 나오나요?

    브라우저에서 이 파일을 열면 왼쪽 위에 정답, 그 아래에 빈 코드 칸이 있습니다.
    정답을 보고 코드 칸에 똑같이 칩니다. Ctrl+Enter로 실행 → 「채점하기」

    이 파일은 브라우저로 열어서 씁니다. 고칠 일이 있을 때만 VS Code로 엽니다.
    stage   : 오른쪽 「실행 화면」에 놓이는 HTML
    starter : 왼쪽 「내 코드」 칸에 처음 들어 있는 코드
  -->
  <template id="stage">
    사탕 개수 : <input type="number" id="count">
    <button onclick="drop()">사탕 놓기</button>
    <ul id="result" class="pop candy"></ul>
  </template>

  <script type="text/plain" id="starter">

  </script>
</body>
