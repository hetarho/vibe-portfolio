<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H1 분식집 메뉴판 · HTML 연습</title>
  <link rel="stylesheet" href="../drill.css">
  <script src="../problems.js"></script>
  <script src="../drill.js" defer></script>
</head>
<body data-problem="htmlMenu" data-step="project" data-edit="html-only">
  <!--
    [0교시 · H1 분식집 메뉴판 · HTML만 만들기]
    오른쪽 위 「완성된 모습」을 보고 왼쪽 코드 칸에 HTML을 씁니다. 정답 코드는 화면에 보여 주지 않습니다.
    치는 대로 오른쪽 아래 「내가 만든 화면」에 바로 나옵니다. 다 되면 「채점하기」.

    이 파일은 브라우저로 열어서 씁니다.
    target  : 「완성된 모습」으로 그리는 HTML (채점은 problems.js의 checks로 합니다)
    starter : 코드 칸에 처음 들어가는 것 · 이 문제는 비어 있습니다
  -->
  <template id="target">
    <h2>분식집 메뉴</h2>
    <p>매일 11시부터 21시까지 문을 엽니다.</p>
    <ul>
      <li>떡볶이 4,000원</li>
      <li>김밥 3,500원</li>
      <li>라면 5,000원</li>
    </ul>
    <p><strong>오늘의 추천</strong> : 떡볶이</p>
  </template>

  <script type="text/plain" id="starter">
  </script>
</body>
</html>
