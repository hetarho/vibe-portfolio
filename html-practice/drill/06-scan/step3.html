    QR 스캔 기록은 A01, B02, A01, C03, B02 다섯 개입니다. 코드 안에 목록으로 둡니다.
    찾을 학번을 넣고 「찾기」를 누르면 기록 다섯 개를 li로 하나씩 보여주고, 찾는 학번은 노랗게 칠합니다.
    아래 결과 네모에는 "OOO 학생은 O번 찍혔습니다"를 보여줍니다.
    노랗게 칠하는 li는 '<li class="hit">' + scans[i] + '</li>'입니다.

    "~면" 앞부분은 if 괄호 ( ) 안에, → 뒷부분은 중괄호 { } 안에 씁니다.

    이 파일은 브라우저로 열어서 씁니다. 고칠 일이 있을 때만 VS Code로 엽니다.
    stage   : 오른쪽 「실행 화면」에 놓이는 HTML
    starter : 왼쪽 「내 코드」 칸에 처음 들어 있는 코드
  -->

    <button onclick="findScan()">찾기</button>
    <ul id="list" class="pop"></ul>
    <div id="result"></div>
  </template>

          //    → html에 '<li class="hit">' + scans[i] + '</li>'를 붙이고
          //    → count에 1을 더한다


        } else {
          // 5. 아니면 → html에 '<li>' + scans[i] + '</li>'를 붙인다

      }

      // 6. html은 기록 목록(id: list)에 넣고,
      //    'OOO 학생은 O번 찍혔습니다'는 결과(id: result)에 보여준다

  </script>
