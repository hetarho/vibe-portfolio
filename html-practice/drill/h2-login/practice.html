<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2 로그인 화면 · HTML 연습</title>
  <link rel="stylesheet" href="../drill.css">
  <script src="../problems.js"></script>
  <script src="../drill.js" defer></script>
</head>
<body data-problem="htmlLogin" data-step="project" data-edit="html-only">
  <!--
    [0교시 · H2 로그인 화면 · HTML만 만들기]
    오른쪽 위 「완성된 모습」을 보고 왼쪽 코드 칸에 HTML을 씁니다. 정답 코드는 화면에 보여 주지 않습니다.
    자바스크립트가 칸을 찾을 수 있게 id를 붙입니다 : 아이디 userId · 비밀번호 pwd · 결과 네모 result
    2교시 「03 로그인」 문제가 이 화면 위에서 돌아갑니다.

    이 파일은 브라우저로 열어서 씁니다.
    target  : 「완성된 모습」으로 그리는 HTML (채점은 problems.js의 checks로 합니다)
    starter : 코드 칸에 처음 들어가는 것 · 이 문제는 비어 있습니다
  -->
  <template id="target">
    <h2>로그인</h2>
    아이디 : <input type="text" id="userId"><br><br>
    비밀번호 : <input type="password" id="pwd"><br><br>
    <button>로그인</button>
    <div id="result"></div>
  </template>

  <script type="text/plain" id="starter">
  </script>
</body>
</html>
