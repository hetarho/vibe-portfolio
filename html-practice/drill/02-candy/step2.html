<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02 사탕 나누기 · Step 2</title>
  <link rel="stylesheet" href="../drill.css">
  <script src="../problems.js"></script>
  <script src="../drill.js" defer></script>
</head>
<body data-problem="candy" data-step="2">
  <!--
    [1교시 · 02 사탕 나누기 · Step 2 값과 연산자만 바꾸기]
    인원과 사탕 개수를 넣고 「나누기」를 누르면 "1인당 O개, 남은 사탕 O개"를 보여줍니다.
    인원이 1보다 적으면 "1명 이상 넣어 주세요"를 보여줍니다.
    몫은 Math.floor(사탕 / 인원), 나머지는 사탕 % 인원으로 구합니다.

    코드 칸에 아래 starter가 들어 있습니다. ___ 자리만 바꿉니다.
    ___ 이 하나라도 남아 있으면 버튼이 동작하지 않습니다.

    이 파일은 브라우저로 열어서 씁니다. 고칠 일이 있을 때만 VS Code로 엽니다.
    stage   : 오른쪽 「실행 화면」에 놓이는 HTML
    starter : 왼쪽 「내 코드」 칸에 처음 들어 있는 코드
  -->
  <template id="stage">
    인원 : <input type="number" id="people">
    사탕 : <input type="number" id="candy">
    <button onclick="share()">나누기</button>
    <div id="result"></div>
  </template>

  <script type="text/plain" id="starter">
    function share() {
      const people = Number(document.getElementById('people').value);
      const candy = Number(document.getElementById('candy').value);

      if (people ___ 1) {  // 연산자 : 1보다 적은가?
        document.getElementById('result').innerHTML = ___;  // 인원이 잘못됐을 때 보여줄 문장
      } else {
        const each = Math.floor(candy ___ people);  // 연산자 : 나눈 몫
        const left = candy ___ people;  // 연산자 : 나머지
        document.getElementById('result').innerHTML = '1인당 ' + each + '개, 남은 사탕 ' + left + '개';
      }
    }
  </script>
</body>
</html>
