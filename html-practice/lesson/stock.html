<!DOCTYPE html>
<html lang="ko">
<head>

  <title>2부 연습 3 · 재고 주문</title>
</head>
<body>
  <!--
    [2부 연습 3 · 절차 보고 쓰기 · 수업 덱 P44]
    떡볶이 재고가 7개 있습니다. 주문 수량을 넣고 버튼을 누를 때마다 재고가 줄어듭니다.
    1개보다 적거나 재고보다 많은 주문은 거절하고 재고를 그대로 둡니다.

    화면은 만들어 두었습니다. 덱 화면의 한글 절차 여섯 줄(0번부터 5번)을
    script 안에 주석으로 먼저 옮겨 적고, 줄마다 옆의 카드를 붙여 코드로 바꿉니다.
    0번 줄은 함수 밖에 둡니다.

    [작은 경우로 확인]
    - 7개 남았을 때 8개 → "재고가 부족합니다" · 그대로 7개
    - 0개               → "1개 이상 주문해 주세요"
    - 3개 → 다시 3개    → 4개 → 1개
    - 1개 남았을 때 3개 → "재고가 부족합니다" · 그대로 1개
  -->
  <h2>떡볶이 주문</h2>

  <p id="stock">남은 재고 7개</p>
  주문 수량 : <input type="number" id="count">
  <button onclick="order()">주문</button>

  <script>
    // ─── 선생님과 함께 채우는 3단계 사고 프레임워크 ───
    // [Step 1] 재료 준비 : 코드를 치기 전에 한국어로 먼저 적는다
    //   - 꺼낼 칸(id)   :
    //   - 보여줄 칸(id) :
    //   - 기억할 그릇   :            (버튼을 누를 때마다 남아 있어야 하면 함수 밖에 둔다 · 0번 줄)
    //   - 이벤트 → 함수 :
    // [Step 2] 껍데기 먼저 치기 : function 이름() { } 와 if () { } else { } 를 속은 비운 채 먼저 친다
    // [Step 3] 빈칸 채우기 : 껍데기 안에 한글 절차를 주석으로 넣고, 줄마다 카드를 붙여 코드로 바꾼다
    //   덱의 한글 절차 여섯 줄(0번~5번)을 여기에 주석으로 옮겨 적고 시작한다

  </script>
</body>
</html>
