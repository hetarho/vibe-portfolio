<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2부 연습 3 · 재고 주문</title>
</head>
<body>
  <!--
    [2부 연습 3 · 절차 보고 쓰기 · 수업 덱 P44]
    떡볶이 재고가 7개 있습니다. 주문 수량을 넣고 버튼을 누를 때마다 재고가 줄어듭니다.
    1개보다 적거나 재고보다 많은 주문은 거절하고 재고를 그대로 둡니다.

    화면은 만들어 두었습니다. 덱 화면의 한글 절차 여섯 줄(0번부터 5번)을
    script 안에 주석으로 먼저 옮겨 적고, 줄마다 옆의 카드를 붙여 코드로 바꿉니다.
    0번 줄은 함수 밖에 둡니다.

    [작은 경우로 확인]
    - 7개 남았을 때 8개 → "재고가 부족합니다" · 그대로 7개
    - 0개               → "1개 이상 주문해 주세요"
    - 3개 → 다시 3개    → 4개 → 1개
    - 1개 남았을 때 3개 → "재고가 부족합니다" · 그대로 1개
  -->
  <h2>떡볶이 주문</h2>

  <p id="stock">남은 재고 7개</p>
  주문 수량 : <input type="number" id="count">
  <button onclick="order()">주문</button>

  <script>

  </script>
</body>
</html>
