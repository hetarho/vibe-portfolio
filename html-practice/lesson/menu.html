<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2부 연습 2 · 메뉴 합계</title>
</head>
<body>
  <!--
    [2부 연습 2 · 빈칸 채우기 · 수업 덱 P42]
    분식 메뉴 네 개에 체크박스가 있습니다. 체크한 메뉴의 가격을 모두 더해 합계를 보여줍니다.
    빈칸_가, 빈칸_나, 빈칸_다를 지우고 알맞은 코드를 씁니다.
    채우기 전에 버튼을 누르면 아무 일도 일어나지 않습니다. (F12 콘솔에 빈칸 이름이 없다는 오류가 뜹니다)

    [작은 경우로 확인]
    - 아무것도 안 고름 → 합계 0원
    - 떡볶이 · 김밥    → 합계 7500원  (04000 같은 글자가 나오면 빈칸 하나를 다시 봅니다)
    - 네 개 전부       → 합계 15000원
  -->
  <h2>분식집 주문</h2>

  <label><input type="checkbox" name="menu" value="4000"> 떡볶이 4,000원</label><br>
  <label><input type="checkbox" name="menu" value="3500"> 김밥 3,500원</label><br>
  <label><input type="checkbox" name="menu" value="5000"> 라면 5,000원</label><br>
  <label><input type="checkbox" name="menu" value="2500"> 튀김 2,500원</label><br>
  <button onclick="total()">합계 보기</button>
  <div id="result"></div>

  <script>
    // ─── 선생님과 함께 채우는 3단계 사고 프레임워크 ───
    // [Step 1] 재료 준비 : 꺼낼 칸(name: menu) · 보여줄 칸(id: result) · 기억할 그릇(sum, 처음 값은?)을 먼저 말로 정한다
    // [Step 2] 껍데기 먼저 치기 : 이 문제는 function, for, if 껍데기를 미리 쳐 두었다. 껍데기를 손가락으로 짚으며 읽어 본다
    // [Step 3] 빈칸 채우기 : 빈칸_가 → 빈칸_나 → 빈칸_다 순서로, 바로 위 한글 주석을 보고 채운다

    function total() {
      // 1. 메뉴 칸을 전부 모은다
      const menus = document.getElementsByName('menu');

      // 2. 합계 그릇을 0원으로 시작한다
      let sum = 빈칸_가;

      // 3. 하나씩 보면서 체크된 메뉴면 가격을 숫자로 바꿔 더한다
      for (let i = 0; i < menus.length; i++) {
        if (빈칸_나) {
          sum += 빈칸_다;
        }
      }

      // 4. 합계를 보여준다
      document.getElementById('result').innerHTML = '합계 ' + sum + '원';
    }
  </script>
</body>
</html>
